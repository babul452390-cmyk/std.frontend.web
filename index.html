<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration — EduRegister</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d0f14;--surface:#161922;--surface2:#1e2330;--border:#2a3040;
      --accent:#4f9cf9;--accent2:#7c3aed;--success:#22d3a0;--error:#f87171;
      --text:#e8eaf0;--muted:#6b7280;--radius:12px;
    }
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
      background-image:radial-gradient(ellipse at 20% 50%,rgba(79,156,249,.07) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 20%,rgba(124,58,237,.07) 0%,transparent 60%);}
    .container{width:100%;max-width:740px;animation:fadeUp .6s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .header{text-align:center;margin-bottom:2.5rem;}
    .logo{display:inline-flex;align-items:center;gap:10px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      font-size:2rem;font-weight:700;letter-spacing:-.5px;margin-bottom:.5rem;}
    .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:10px;display:flex;align-items:center;justify-content:center;
      font-size:1.2rem;-webkit-text-fill-color:white;}
    .subtitle{color:var(--muted);font-size:.9rem;font-weight:300;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
      padding:2.5rem;box-shadow:0 25px 50px rgba(0,0,0,.4);}
    .sec{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--accent);
      letter-spacing:2px;text-transform:uppercase;margin:1.8rem 0 1rem;
      padding-bottom:.5rem;border-bottom:1px solid var(--border);}
    .sec:first-child{margin-top:0;}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;}
    @media(max-width:580px){.grid-2,.grid-3{grid-template-columns:1fr}.card{padding:1.5rem}}
    .field{display:flex;flex-direction:column;gap:6px;}
    label{font-size:.78rem;color:var(--muted);font-weight:500;}
    label .req{color:var(--error);margin-left:3px;}
    input,select,textarea{background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--radius);color:var(--text);font-family:'Sora',sans-serif;
      font-size:.9rem;padding:.75rem 1rem;outline:none;width:100%;
      transition:border-color .2s,box-shadow .2s;}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,156,249,.12);}
    select option{background:var(--surface2);}
    textarea{resize:vertical;min-height:80px;}

    /* Photo upload */
    .photo-area{border:2px dashed var(--border);border-radius:var(--radius);
      padding:1.5rem;text-align:center;cursor:pointer;transition:border-color .2s;position:relative;}
    .photo-area:hover{border-color:var(--accent);}
    .photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .photo-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;
      border:3px solid var(--accent);margin:0 auto .8rem;display:none;}
    .photo-label{color:var(--muted);font-size:.82rem;}
    .photo-label span{color:var(--accent);font-weight:600;}

    .btn{width:100%;padding:1rem;margin-top:2rem;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:none;border-radius:var(--radius);color:white;font-family:'Sora',sans-serif;
      font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .2s;}
    .btn:hover{opacity:.9;transform:translateY(-1px);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .alert{padding:.9rem 1.2rem;border-radius:var(--radius);margin-bottom:1.5rem;font-size:.88rem;display:none;}
    .alert.show{display:block;animation:fadeIn .3s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .alert-success{background:rgba(34,211,160,.1);border:1px solid rgba(34,211,160,.3);color:var(--success);}
    .alert-error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--error);}
    .admin-link{text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--muted);}
    .admin-link a{color:var(--accent);text-decoration:none;font-weight:500;}
    .admin-link a:hover{text-decoration:underline;}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><div class="logo-icon">🎓</div>EduRegister</div>
    <p class="subtitle">Student Personal Information Registration Portal</p>
  </div>

  <div class="card">
    <div id="alert" class="alert"></div>

    <!-- Photo -->
    <div class="sec">// Profile Photo</div>
    <div class="photo-area" id="photoArea">
      <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(this)"/>
      <img id="photoPreview" class="photo-preview" alt="Preview"/>
      <div class="photo-label">Click to upload photo &nbsp;<span>Browse</span></div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:.3rem;">Max 2MB · JPG / PNG / WebP</div>
    </div>

    <!-- Personal -->
    <div class="sec">// Personal Information</div>
    <div class="grid-2">
      <div class="field"><label>Full Name <span class="req">*</span></label><input id="name" placeholder="Md. Rakib Hasan"/></div>
      <div class="field"><label>Email Address <span class="req">*</span></label><input type="email" id="email" placeholder="student@example.com"/></div>
    </div>
    <div class="grid-2" style="margin-top:1rem">
      <div class="field"><label>Phone Number</label><input type="tel" id="phone" placeholder="01700-000000"/></div>
      <div class="field"><label>Date of Birth</label><input type="date" id="dob"/></div>
    </div>
    <div class="grid-2" style="margin-top:1rem">
      <div class="field">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Address</label><input id="address" placeholder="Village, Upazila, District"/></div>
    </div>

    <!-- Academic -->
    <div class="sec">// Academic Information</div>
    <div class="grid-3">
      <div class="field">
        <label>Class</label>
        <select id="class">
          <option value="">Select Class</option>
          <option>Class 6</option><option>Class 7</option><option>Class 8</option>
          <option>Class 9</option><option>Class 10</option><option>Class 11</option>
          <option>Class 12</option><option>HSC 1st Year</option><option>HSC 2nd Year</option>
          <option>Degree 1st Year</option><option>Degree 2nd Year</option><option>Degree 3rd Year</option>
        </select>
      </div>
      <div class="field"><label>Section</label><input id="section" placeholder="A / B / Science"/></div>
      <div class="field"><label>Roll Number</label><input id="roll_number" placeholder="101"/></div>
    </div>

    <!-- Guardian -->
    <div class="sec">// Guardian Information</div>
    <div class="grid-2">
      <div class="field"><label>Guardian Name</label><input id="guardian_name" placeholder="Father / Mother / Guardian"/></div>
      <div class="field"><label>Guardian Phone</label><input type="tel" id="guardian_phone" placeholder="01800-000000"/></div>
    </div>

    <button class="btn" id="submitBtn" onclick="registerStudent()">Submit Registration</button>
  </div>

  <div class="admin-link">Admin? <a href="admin.html">Go to Admin Panel →</a></div>
</div>

<script>
  const API = 'https://std-web-9w6q.onrender.com';

  function previewPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('photoPreview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  async function registerStudent() {
    const btn = document.getElementById('submitBtn');
    const name  = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    if (!name || !email) { showAlert('error','⚠️ Name and Email are required!'); return; }

    btn.disabled = true; btn.textContent = 'Submitting...';

    const fd = new FormData();
    const fields = ['name','email','phone','dob','gender','address','section','roll_number','guardian_name','guardian_phone'];
    fields.forEach(f => fd.append(f, document.getElementById(f)?.value || ''));
    fd.append('class', document.getElementById('class').value);
    const photo = document.getElementById('photoInput').files[0];
    if (photo) fd.append('photo', photo);

    try {
      const res    = await fetch(`${API}/api/register`, { method:'POST', body: fd });
      const result = await res.json();
      if (res.ok) {
        showAlert('success', `✅ Registration successful! Student ID: #${result.id}`);
        document.querySelectorAll('input,select').forEach(el => el.value = '');
        document.getElementById('photoPreview').style.display = 'none';
      } else {
        showAlert('error', '❌ ' + result.error);
      }
    } catch {
      showAlert('error', '🔌 Cannot connect to server. Make sure backend is running on port 5000.');
    }
    btn.disabled = false; btn.textContent = 'Submit Registration';
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type} show`;
    el.textContent = msg;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
  }
</script>
</body>
</html>
